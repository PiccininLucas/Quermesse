services:
  - type: web
    name: quermesse-estoque
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: DATABASE_URL
        fromDatabase:
          name: quermesse-db
          property: connectionString

databases:
  - name: quermesse-db
    plan: free
